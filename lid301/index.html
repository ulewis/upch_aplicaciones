<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15537d">
  <title>LID 301 · Control de asistencia</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f4f7fa;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    #shell{position:fixed;inset:0;display:grid;grid-template-rows:1fr;background:#f4f7fa}
    iframe{width:100%;height:100%;border:0;background:#f4f7fa;display:block}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fa;color:#17324a;font-weight:800;z-index:5;transition:opacity .2s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .fallback{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:none;z-index:6;text-align:center}
    .fallback a{display:inline-block;background:#15537d;color:#fff;text-decoration:none;font-weight:800;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(24,55,80,.15)}
    @media(max-width:600px){iframe{height:100dvh}#loading{font-size:15px}}
  </style>
</head>
<body>
  <div id="loading">Cargando LID 301…</div>
  <div id="shell"><iframe id="app" title="LID 301" src="https://script.google.com/macros/s/AKfycbyKWiY6tKp4JMa9y__6HcZItW7bNPu2YJX0TkqsQiBm5vSllwBVrB7g0YoxFK5Qv-7Z5g/exec" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div class="fallback" id="fallback"><a href="https://script.google.com/macros/s/AKfycbyKWiY6tKp4JMa9y__6HcZItW7bNPu2YJX0TkqsQiBm5vSllwBVrB7g0YoxFK5Qv-7Z5g/exec" target="_top">Abrir LID 301</a></div>
  <script>
    const frame=document.getElementById('app');
    const loading=document.getElementById('loading');
    const fallback=document.getElementById('fallback');
    frame.addEventListener('load',()=>{loading.classList.add('hide');});
    setTimeout(()=>{fallback.style.display='block';},8000);
  </script>
</body>
</html>
